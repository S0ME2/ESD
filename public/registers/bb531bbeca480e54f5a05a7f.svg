<svg xmlns="http://www.w3.org/2000/svg" width="830" viewBox="0 0 830 291" role="img" aria-label="The special registers.  Shaded = what this deck uses; xPSR, 32 bits; PRIMASK, 32 bits; CONTROL, 32 bits"><style>
svg{color:#172640}text{fill:currentColor;font:13px sans-serif;dominant-baseline:middle}
.mono{font-family:monospace}.lbl{fill:#52627a;font-size:11px}
