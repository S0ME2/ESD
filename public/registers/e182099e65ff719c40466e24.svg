<text x="813.4" y="20" text-anchor="end" class="mono lbl">0</text>
<rect class="dash" x="174.4" y="28" width="620.0" height="26"/>
<text x="484.4" y="41" text-anchor="middle" class="lbl">reserved</text>
<rect class="hifill" x="794.4" y="28" width="20.0" height="26"/>
<text x="804.4" y="67" text-anchor="middle" class="mono halo">PM</text>
</svg>