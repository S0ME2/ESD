<svg xmlns="http://www.w3.org/2000/svg" width="382" viewBox="0 0 382 292" role="img" aria-label="MPU6050 registers (layout from the Adafruit_MPU6050 driver); CONFIG, 8 bits; GYRO_CONFIG, 8 bits; PWR_MGMT_1, 8 bits"><style>
svg{color:#172640}text{fill:currentColor;font:13px sans-serif;dominant-baseline:middle}
